<article [attr.data-color]="color()" class="h-14 flex justify-between px-4 rounded-xl">
  <header class="flex items-center gap-4">
    <img [src]="icon()" alt="Reaction icon" />
    <h3 class="text-preset-6-medium">{{ title() }}</h3>
  </header>
  <p class="text-preset-6-bold flex gap-2 items-center text-navy-950">
    <strong>{{ result() }}</strong> <span class="opacity-50">/ 100</span>
  </p>
</article>
