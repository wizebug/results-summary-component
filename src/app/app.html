<header class="sr-only">
  <h1>Resuls Summary Component</h1>
</header>

<main>
  <section class="gradient-2 rounded-bl-4xl rounded-br-4xl">
    <div class="w-65 mx-auto flex flex-col items-center py-8 gap-6">
      <h2 class="text-preset-5-bold text-navy-200 text-center">Your Result</h2>
      <p class="h-35 w-35 rounded-full flex flex-col justify-center items-center gradient-1">
        <span class="text-preset-2 text-white">76</span>
        <span class="text-preset-6-bold text-navy-200">of 100</span>
      </p>
      <p class="flex flex-col gap-2">
        <strong class="text-preset-4 text-center text-white">Great</strong>
        <span class="text-preset-6-medium text-center text-navy-200"
          >You scored higher than 65% of the people who have taken these tests.</span
        >
      </p>
    </div>
  </section>

  <section>
    <h2>Resumo</h2>
    <ul>
      <li>
        <div>
          <img src="icon/icon-reaction.svg" alt="Reaction icon" />
          <span>Reação</span>
        </div>
        <div><strong>80</strong> <span>/ 100</span></div>
      </li>

      <li>
        <div>
          <img src="icon/icon-memory.svg" alt="Memory icon" />
          <span>Memória</span>
        </div>
        <div><strong>92</strong> <span>/ 100</span></div>
      </li>

      <li>
        <div>
          <img src="icon/icon-verbal.svg" alt="Verbal icon" />
          <span>Verbal</span>
        </div>
        <div><strong>61</strong> <span>/ 100</span></div>
      </li>

      <li>
        <div>
          <img src="icon/icon-visual.svg" alt="Visual icon" />
          <span>Visual</span>
        </div>
        <div><strong>73</strong> <span>/ 100</span></div>
      </li>
    </ul>

    <button type="button">Continuar</button>
  </section>
</main>
